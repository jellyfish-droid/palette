<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五色配色盤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; margin: 0; font-family: 'Roboto', sans-serif; }
        .action-btn { opacity: 0; transition: opacity 0.2s ease; z-index: 20; }
        .color-card:hover .action-btn { opacity: 1; }
        .nav-btn { transition: transform 0.2s; }
        .nav-btn:hover { transform: scale(1.05); }
        .color-code-text { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body>

    <div id="palette-container" class="flex flex-col md:flex-row grow w-full h-screen"></div>

    <div id="controls" class="fixed bottom-8 left-8 md:right-8 md:left-auto flex flex-col md:flex-row gap-4 z-40">
        <button id="download-btn" class="nav-btn bg-black/50 hover:bg-black text-white p-4 rounded-full backdrop-blur-md shadow-xl transition-all" title="下載圖片">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
        </button>
        <button id="generate-btn" class="nav-btn bg-black/50 hover:bg-black text-white p-4 rounded-full backdrop-blur-md shadow-xl transition-all" title="重新產生">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
        </button>
    </div>

    <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 bg-black/80 text-white px-6 py-3 rounded-full shadow-2xl hidden z-50">
        色碼已複製！
    </div>

    <script>
        const paletteContainer = document.getElementById('palette-container');
        const generateBtn = document.getElementById('generate-btn');
        const downloadBtn = document.getElementById('download-btn');
        const toast = document.getElementById('toast');
        let colors = Array(5).fill(null);

        // 使用標準 sRGB 處理函數
        function getRandomColor() {
            return '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0').toUpperCase();
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }

        function getInverseRgb(rgb) {
            return {
                r: 255 - rgb.r,
                g: 255 - rgb.g,
                b: 255 - rgb.b
            };
        }

        function createPalette() {
            paletteContainer.innerHTML = '';
            colors.forEach((c, i) => {
                if (!c) colors[i] = { hex: getRandomColor(), locked: false, showInverse: false };
                
                const colorObj = colors[i];
                const rgb = hexToRgb(colorObj.hex);
                const invRgb = getInverseRgb(rgb);
                
                const displayBg = colorObj.showInverse ? `rgb(${invRgb.r}, ${invRgb.g}, ${invRgb.b})` : colorObj.hex;
                const displayTextColor = colorObj.showInverse ? `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})` : `rgb(${invRgb.r}, ${invRgb.g}, ${invRgb.b})`;
                
                const colorBox = document.createElement('div');
                colorBox.className = `color-card grow flex flex-col items-center justify-center relative cursor-pointer`;
                colorBox.style.backgroundColor = displayBg;
                
                colorBox.innerHTML = `
                    <span class="color-code-text font-bold text-2xl md:text-4xl pointer-events-none transition-transform hover:scale-110" style="color: ${displayTextColor};">${colorObj.showInverse ? `#${(invRgb.r<<16 | invRgb.g<<8 | invRgb.b).toString(16).padStart(6,'0').toUpperCase()}` : colorObj.hex}</span>
                    <div class="absolute top-6 right-6 flex flex-row-reverse md:flex-col gap-2 z-30">
                        <button class="action-btn lock-btn text-xs font-semibold px-4 py-2 rounded-full transition-colors ${colorObj.locked ? 'bg-black text-white' : 'bg-white/30 text-black backdrop-blur-sm hover:bg-white/50'}">
                            ${colorObj.locked ? '已鎖定' : '鎖定'}
                        </button>
                        <button class="action-btn invert-btn text-xs font-semibold px-4 py-2 rounded-full transition-colors bg-white/30 text-black backdrop-blur-sm hover:bg-white/50">
                            ${colorObj.showInverse ? '顯示原色' : '顯示補色'}
                        </button>
                    </div>
                `;
                
                colorBox.addEventListener('click', (e) => {
                    if(!e.target.classList.contains('action-btn')) copyToClipboard(colorObj.hex);
                });

                colorBox.querySelector('.lock-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    colors[i].locked = !colors[i].locked;
                    createPalette();
                });

                colorBox.querySelector('.invert-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    colors[i].showInverse = !colors[i].showInverse;
                    createPalette();
                });

                paletteContainer.appendChild(colorBox);
            });
        }

        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 1500);
        }

        document.getElementById('download-btn').addEventListener('click', () => {
            document.getElementById('controls').style.display = 'none'; 
            html2canvas(document.body).then(canvas => {
                const link = document.createElement('a');
                link.download = 'palette.png';
                link.href = canvas.toDataURL();
                link.click();
                document.getElementById('controls').style.display = 'flex'; 
            });
        });

        generateBtn.addEventListener('click', () => {
            colors = colors.map(c => c.locked ? c : { hex: getRandomColor(), locked: false, showInverse: false });
            createPalette();
        });

        createPalette();
    </script>
</body>
</html>
